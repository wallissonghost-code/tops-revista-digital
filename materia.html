<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matéria | TOPS</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="header-inner"><a class="logo" href="index.html"><img src="assets/tops-logo.svg" alt="TOPS"></a><nav class="nav"><a href="index.html">Início</a><a href="index.html#destaques">Matérias</a><a href="index.html#revista">Revista 3D</a><a class="admin-link" href="admin.html">Painel ADM</a></nav></div></header><main class="page article-page"><article id="articleDetail" class="article-main surface"></article><aside class="sidebar"><div class="sidebox surface"><h3>Ouvir matéria</h3><div class="actions"><button class="btn gold" id="listenArticle">▶ Ouvir</button><button class="btn" onclick="pauseSpeech()">Pausar</button><button class="btn" onclick="resumeSpeech()">Continuar</button><button class="btn" onclick="stopSpeech()">Parar</button></div><label>Velocidade <select id="speechRate"><option value="0.8">0,8×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option></select></label></div><div class="sidebox surface"><h3>Mais matérias</h3><div id="related"></div></div></aside></main><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=loadData();const id=Number(new URLSearchParams(location.search).get('id')||1);const a=d.articles.find(x=>x.id===id)||d.articles[0];articleDetail.innerHTML='<span class="kicker">'+esc(a.category)+'</span><h1>'+esc(a.title)+'</h1><p style="color:var(--muted)">Por '+esc(a.author)+'</p><img class="article-cover" src="'+a.image+'"><div class="article-text">'+a.content.split('\n').filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';related.innerHTML=d.articles.filter(x=>x.id!==a.id).map(x=>'<p><a href="materia.html?id='+x.id+'">'+esc(x.title)+'</a></p>').join('');listenArticle.onclick=()=>speakText(a.title+'. '+a.summary+'. '+a.content)});</script></body></html>
