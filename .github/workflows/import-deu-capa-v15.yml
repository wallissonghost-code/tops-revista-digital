name: Import DEU CAPA v15

on:
  push:
    branches:
      - agent/deu-capa-v15-upload
    paths:
      - ".github/workflows/import-deu-capa-v15.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        run: |
          cat .import2/part-* | base64 -d > /tmp/deu-capa-v15.tar.xz
          mkdir -p /tmp/deu-import
          tar -xJf /tmp/deu-capa-v15.tar.xz -C /tmp/deu-import

      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/deu-import/. .
          git status --short

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import DEU CAPA digital magazine v15"
          git push origin HEAD:agent/deu-capa-v15-upload
